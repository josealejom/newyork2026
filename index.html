<style>
  :root{
    --bg:#FAF8F5; --card:#FFFFFF; --card-2:#FBFAF8; --line:#E7E3DC; --ink:#181A1F; --muted:#767D8A;
    --hotel:#6B4A9E; --transfer:#1F7A88; --place:#D9550A; --meal:#B23350;
    --tabbar-h:62px; --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overscroll-behavior:none; }
  body{ background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; min-height:100dvh; }

  .app{ display:flex; min-height:100vh; min-height:100dvh; }
  .sidenav{ display:none; }
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; height:100dvh; }

  .topbar{ flex:none; padding:calc(var(--safe-top) + 10px) 18px 12px; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .topbar .brand{ display:flex; align-items:center; gap:9px; }
  .topbar .brand-icon{ width:28px; height:28px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex:none; }
  .topbar .brand-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .topbar h1{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:19px; margin:0; letter-spacing:.01em; }
  .topbar .datebadge{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 9px; }

  .content{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(var(--tabbar-h) + var(--safe-bottom) + 24px); }

  .day-view{ display:none; }
  .day-view.active{ display:block; animation:fadein .2s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .kicker{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .kicker::before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--place); }
  .day-title{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:30px; line-height:.95; margin:5px 0 18px; letter-spacing:-.01em; text-transform:uppercase; }

  .filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .chip{ display:flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; padding:8px 13px 8px 8px; border-radius:999px; border:1.5px solid var(--c); background:#fff; color:var(--c); cursor:pointer; }
  .chip .roundel{ width:18px; height:18px; border-radius:50%; background:var(--c); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:11px; flex:none; }
  .chip.active{ background:var(--c); color:#fff; }
  .chip.active .roundel{ background:#fff; color:var(--c); }
  .chip:not(.active){ opacity:.5; }

  .timeline{ position:relative; padding-left:26px; }
  .timeline::before{ content:''; position:absolute; left:9px; top:6px; bottom:6px; width:3px; background:var(--line); border-radius:3px; }
  .stop{ position:relative; margin-bottom:11px; }
  .stop.hidden{ display:none; }
  .stop-dot{ position:absolute; left:-26px; top:19px; width:20px; height:20px; border-radius:50%; background:var(--c); border:3px solid var(--bg); box-shadow:0 0 0 1.5px var(--c); }

  .card{ background:var(--card); border:1px solid var(--line); border-left:5px solid var(--c); border-radius:10px; box-shadow:0 1px 3px rgba(20,20,30,.04); overflow:hidden; }
  .card-head{ display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; }
  .card-head .logo{ width:46px; height:46px; border-radius:11px; flex:none; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .card-head .logo img{ width:100%; height:100%; object-fit:contain; padding:8px; }
  .card-head .logo .fb{ font-size:19px; width:100%; height:100%; align-items:center; justify-content:center; }
  .card-head .txt{ flex:1; min-width:0; }
  .card-head .cat-label{ font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--c); font-weight:700; }
  .card-head .title{ font-weight:700; font-size:15px; line-height:1.25; margin-top:1px; }
  .card-head .meta{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); margin-top:3px; }
  .card-head .side{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .duration{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; border:1.3px solid var(--c); color:var(--c); white-space:nowrap; }
  .chev{ width:15px; height:15px; color:var(--muted); transition:transform .2s; }
  .card.open .chev{ transform:rotate(180deg); }

  .card-body{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .card.open .card-body{ max-height:5000px; }
  .card-body-inner{ padding:2px 16px 16px 72px; font-size:12.5px; color:#454B57; line-height:1.55; }
  .card-body-inner ul{ margin:0 0 10px; padding-left:16px; }
  .card-body-inner li{ margin-bottom:4px; }
  .actions{ display:flex; gap:7px; flex-wrap:wrap; }
  .actions a{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; text-decoration:none; border:1.3px solid var(--c); color:var(--c); border-radius:8px; padding:5px 10px; }

  .meal-note{ font-size:11.5px; color:var(--muted); margin-bottom:9px; }

  .rest{ background:var(--card-2); border:1px solid var(--line); border-radius:9px; margin-top:7px; overflow:hidden; }
  .rest-head{ display:flex; align-items:center; gap:10px; padding:9px 10px; cursor:pointer; }
  .rest-head .logo{ width:36px; height:36px; border-radius:9px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden; }
  .rest-head .logo img{ width:100%; height:100%; object-fit:contain; padding:6px; }
  .rest-head .logo .fb{ font-size:14px; width:100%; height:100%; align-items:center; justify-content:center; }
  .rest-head .nm{ flex:1; font-weight:700; font-size:12.5px; }
  .rest-head .domain{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted); }
  .rest-head .price{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); font-weight:600; flex:none; }
  .rest-head .rchev{ width:13px; height:13px; color:var(--muted); flex:none; transition:transform .2s; }
  .rest.open .rchev{ transform:rotate(180deg); }
  .rest-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .rest.open .rest-body{ max-height:600px; border-top:1px solid var(--line); }
  .rest-body-inner{ padding:9px 11px 11px; font-size:11.5px; color:#454B57; line-height:1.5; }
  .rest-body-inner ul{ margin:0 0 8px; padding-left:15px; }
  .ratings{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; font-family:'IBM Plex Mono',monospace; font-size:9px; }
  .ratings span{ background:#fff; border:1px solid var(--line); border-radius:5px; padding:2px 6px; }
  .flag{ display:inline-block; background:#FFF3CD; color:#8A6300; font-family:'IBM Plex Mono',monospace; font-size:9px; padding:1px 6px; border-radius:5px; margin-left:4px; }

  .tabbar{ position:fixed; left:0; right:0; bottom:0; height:calc(var(--tabbar-h) + var(--safe-bottom)); padding-bottom:var(--safe-bottom); background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; z-index:20; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:none; background:none; cursor:pointer; color:var(--muted); padding:6px 2px; }
  .tab .tab-dot{ width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-family:'Big Shoulders Display',sans-serif; font-size:12px; font-weight:800; background:var(--card-2); color:var(--muted); }
  .tab.active .tab-dot{ background:var(--ink); color:#fff; }
  .tab .tab-label{ font-size:9px; font-weight:600; font-family:'IBM Plex Mono',monospace; }
  .tab.active .tab-label{ color:var(--ink); }

  @media (max-width:359px){
    .content{ padding:12px 12px calc(var(--tabbar-h) + var(--safe-bottom) + 20px); }
    .card-head{ padding:11px 12px; gap:10px; }
    .card-head .logo{ width:40px; height:40px; }
    .card-head .title{ font-size:14px; }
  }

  @media (min-width:768px){
    .tabbar{ display:none; }
    .app{ max-width:1200px; margin:0 auto; }
    .sidenav{ display:flex; flex-direction:column; width:248px; flex:none; border-right:1px solid var(--line); padding:22px 16px; height:100vh; height:100dvh; position:sticky; top:0; overflow-y:auto; }
    .sidenav .brand{ display:flex; align-items:center; gap:10px; padding:0 6px 20px; }
    .sidenav .brand-icon{ width:32px; height:32px; border-radius:9px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex:none; }
    .sidenav .brand-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
    .sidenav h1{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:19px; margin:0; }
    .sidenav .brand-sub{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); margin-top:1px; }
    .side-tab{ display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:12px; border:none; background:none; cursor:pointer; text-align:left; width:100%; color:var(--ink); margin-bottom:4px; }
    .side-tab:hover{ background:var(--card-2); }
    .side-tab.active{ background:var(--card-2); }
    .side-tab .side-dot{ width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-family:'Big Shoulders Display',sans-serif; font-size:13px; font-weight:800; background:var(--card-2); color:var(--muted); }
    .side-tab.active .side-dot{ background:var(--ink); color:#fff; }
    .side-tab .side-txt{ min-width:0; }
    .side-tab .side-label{ font-size:12px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
    .side-tab .side-title{ font-size:10.5px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .main{ height:100vh; height:100dvh; }
    .topbar{ display:none; }
    .content{ padding:36px 40px 48px; max-width:760px; margin:0 auto; width:100%; }
    .day-title{ font-size:38px; }
    .card-head{ padding:16px 17px; gap:14px; }
    .card-head .logo{ width:52px; height:52px; }
    .card-head .title{ font-size:16.5px; }
    .card-body-inner{ padding:2px 18px 18px 79px; font-size:13px; }
  }
  @media (min-width:1024px){
    .sidenav{ width:272px; padding:26px 18px; }
    .content{ max-width:820px; padding:44px 48px 56px; }
  }
</style>

<script>
function gmapsSearch(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
function gmapsDirections(from,to,mode){ return "https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(from)+"&destination="+encodeURIComponent(to)+"&travelmode="+mode; }
function domainFromUrl(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return ''; } }

function logoWithFavicon(domain, fallbackEmoji){
  var clearbit = "https://logo.clearbit.com/" + domain;
  var favicon = "https://www.google.com/s2/favicons?domain=" + domain + "&sz=128";
  return "<div class='logo'>"
    + "<img src='"+clearbit+"' onerror=\"this.style.display='none';this.nextElementSibling.style.display='block';\">"
    + "<img src='"+favicon+"' style='display:none' onerror=\"this.style.display='none';this.nextElementSibling.style.display='flex';\">"
    + "<div class='fb' style='display:none'>"+fallbackEmoji+"</div>"
    + "</div>";
}
function logoEmoji(emoji){
  return "<div class='logo'><div class='fb' style='display:flex'>"+emoji+"</div></div>";
}

const CAT_LABEL = { hotel:'HOTEL', transfer:'TRASLADO', place:'LUGAR', meal:'COMIDA' };

function restaurantHTML(r){
  var domain = domainFromUrl(r.menuUrl);
  return "<div class='rest'>"
    + "<div class='rest-head' onclick=\"this.parentElement.classList.toggle('open')\">"
    + logoWithFavicon(domain, r.emoji)
    + "<div style='flex:1;min-width:0'><div class='nm'>"+r.name+"</div><div class='domain'>"+domain+"</div></div>"
    + "<div class='price'>"+r.price+"</div>"
    + "<svg class='rchev' viewBox='0 0 24 24' fill='none'><path d='M6 9l6 6 6-6' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg>"
    + "</div>"
    + "<div class='rest-body'><div class='rest-body-inner'>"
    + "<ul>"+r.bullets.map(function(b){return "<li>"+b+"</li>";}).join('')+"</ul>"
    + "<div class='ratings'>"
    + (r.google?"<span>Google "+r.google+"</span>":"")
    + (r.yelp?"<span>Yelp "+r.yelp+"</span>":"")
    + (r.tripadvisor?"<span>TripAdvisor "+r.tripadvisor+"</span>":"")
    + "</div><div class='actions'>"
    + "<a href='"+r.menuUrl+"' target='_blank' rel='noopener'>Ver menu</a>"
    + "<a href='"+r.mapsUrl+"' target='_blank' rel='noopener'>Ver ubicacion</a>"
    + "</div></div></div></div>";
}

  { cat:'hotel', icon:'&#129523;', title:'Despertar y maletas', time:'5:30 AM', text:'Dejar el equipaje listo la noche anterior para salir rapido.' },
  { cat:'transfer', icon:'&#128661;', title:'Uber a LGA', time:'6:00 AM', sub:'Salida con margen', dur:'~15-20 min',
    note:'Salida a las 6:00 AM para llegar con margen antes del vuelo.', from:'SpringHill Suites New York Queens 38-39 9th St Long Island City', to:'LaGuardia Airport New York', mode:'driving' },
  { cat:'transfer', icon:'&#9992;', title:'Vuelo AA970 LGA-MIA', time:'7:59 AM', sub:'Inicio etapa Miami-Orlando',
    note:'Primer vuelo del dia, hacia Miami.', from:'LaGuardia Airport New York', to:'LaGuardia Airport New York', mode:'driving' },
]},
];

const content = document.getElementById('content');
const tabbar = document.getElementById('tabbar');
const sidenavList = document.getElementById('sidenavList');

days.forEach((day, idx)=>{
  const tab = document.createElement('button');
  tab.className = 'tab' + (idx===0?' active':'');
  tab.dataset.target = day.id;
  tab.innerHTML = "<div class='tab-dot'>"+day.label+"</div><div class='tab-label'>"+day.dateLabel+"</div>";
  tab.addEventListener('click', ()=> selectDay(day.id));
  tabbar.appendChild(tab);

  const side = document.createElement('button');
  side.className = 'side-tab' + (idx===0?' active':'');
  side.dataset.target = day.id;
  side.innerHTML = "<div class='side-dot'>"+day.label+"</div><div class='side-txt'><div class='side-label'>"+day.dateLabel+"</div><div class='side-title'>"+day.title+"</div></div>";
  side.addEventListener('click', ()=> selectDay(day.id));
  sidenavList.appendChild(side);

  const view = document.createElement('div');
  view.className = 'day-view' + (idx===0?' active':'');
  view.id = day.id;

  let html = "<div class='kicker'>"+day.dateLabel+"</div><div class='day-title'>"+day.title+"</div>"
    + "<div class='filters'>"
    + "<button class='chip active' data-cat='hotel' style='--c:var(--hotel)'><span class='roundel'>H</span>Hotel</button>"
    + "<button class='chip active' data-cat='transfer' style='--c:var(--transfer)'><span class='roundel'>T</span>Traslados</button>"
    + "<button class='chip active' data-cat='place' style='--c:var(--place)'><span class='roundel'>L</span>Lugares</button>"
    + "<button class='chip active' data-cat='meal' style='--c:var(--meal)'><span class='roundel'>C</span>Comidas</button>"
    + "</div><div class='timeline'>";

  day.items.forEach((it)=>{
    let bodyHtml = '';
    let metaLine = '';
    let logo = '';

    if(it.isMeal){
      bodyHtml = "<div class='meal-note'>"+it.note+"</div>" + it.options.map(restaurantHTML).join('');
      metaLine = it.time;
      logo = logoEmoji(it.icon);
    } else if(it.cat === 'transfer'){
      var url = gmapsDirections(it.from, it.to, it.mode);
      bodyHtml = "<div style='margin-bottom:10px;'>"+it.note+"</div><div class='actions'><a href='"+url+"' target='_blank' rel='noopener'>Como llegar en Google Maps</a></div>";
      metaLine = it.time + (it.sub ? (" &middot; "+it.sub) : '');
      logo = logoEmoji(it.icon);
    } else if(it.cat === 'place'){
      bodyHtml = "<ul>"+it.bullets.map(function(b){return "<li>"+b+"</li>";}).join('')+"</ul>";
      bodyHtml += "<div class='actions'>";
      if(it.ticketUrl){ bodyHtml += "<a href='"+it.ticketUrl+"' target='_blank' rel='noopener'>Comprar tiquetes ("+it.ticketPrice+")</a>"; }
      bodyHtml += "<a href='"+gmapsSearch(it.mapQuery)+"' target='_blank' rel='noopener'>Ver ubicacion</a></div>";
      metaLine = it.time + (it.domain ? (" &middot; "+it.domain) : '');
      logo = it.domain ? logoWithFavicon(it.domain, it.icon) : logoEmoji(it.icon);
    } else {
      bodyHtml = it.text || '';
      metaLine = it.time;
      logo = logoEmoji(it.icon);
    }

    var durBadge = it.dur ? "<div class='duration'>"+it.dur+"</div>" : "";

    html += "<div class='stop' data-cat='"+it.cat+"'><div class='stop-dot' style='--c:var(--"+it.cat+")'></div>"
      + "<div class='card' style='--c:var(--"+it.cat+")'>"
      + "<div class='card-head' onclick=\"this.parentElement.classList.toggle('open')\">"
      + logo
      + "<div class='txt'><div class='cat-label'>"+CAT_LABEL[it.cat]+"</div><div class='title'>"+it.title+"</div><div class='meta'>"+metaLine+"</div></div>"
      + "<div class='side'>"+durBadge+"<svg class='chev' viewBox='0 0 24 24' fill='none'><path d='M6 9l6 6 6-6' stroke='currentColor' stroke-width='2' stroke-linecap='round'/></svg></div>"
      + "</div>"
      + "<div class='card-body'><div class='card-body-inner'>"+bodyHtml+"</div></div>"
      + "</div></div>";
  });

  html += "</div>";
  view.innerHTML = html;
  content.appendChild(view);

  view.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      chip.classList.toggle('active');
      var activeCats = [].slice.call(view.querySelectorAll('.chip.active')).map(function(c){return c.dataset.cat;});
      view.querySelectorAll('.stop[data-cat]').forEach(function(stop){
        stop.classList.toggle('hidden', activeCats.indexOf(stop.dataset.cat) === -1);
      });
    });
  });
});

function selectDay(id){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.target===id); });
  document.querySelectorAll('.side-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.target===id); });
  document.querySelectorAll('.day-view').forEach(function(d){ d.classList.toggle('active', d.id===id); });
  document.getElementById('content').scrollTop = 0;
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
